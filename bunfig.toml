# Bun configuration
[test]
# Bind unit tests to a throwaway SQLite file before any test module imports
# the db layer — otherwise the first import wins and tests write to the real
# on_the_beach.db dev database. See tests/unit/preload.ts.
preload = ["./tests/unit/preload.ts", "./scripts/stryker-bun/harness-preload.ts"]
# The second preload only does anything during Stryker mutation runs (it is
# gated on __STRYKER_BUN_HARNESS__, set by scripts/stryker-bun/bun-test-runner.mjs):
# it rewrites bun:test imports to a shim that reports per-test mutant coverage.
