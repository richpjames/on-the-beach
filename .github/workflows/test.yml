name: Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned: unpinned fetches the newest release, whose asset 504s from
          # hosted runners for a while after it's cut. Bump deliberately.
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      # The layer boundaries in .oxlintrc.json are only enforced where oxlint
      # runs. Without this step it fires in the pre-commit hook and nowhere
      # else, so anything landing via --no-verify or the web UI skips it.
      - name: Lint
        run: bun run lint

      - name: Run unit tests
        run: bun run test:unit

      # bun runs the whole suite in one process, so a file that leaks env
      # flags, fetch spies or DB rows only breaks whichever file happens to
      # run after it — an order that differs between CI and local. A second
      # pass in random order surfaces that. Bun prints the seed it used, so
      # a failure can be replayed with `bun test tests/unit --seed=<n>`.
      - name: Run unit tests in random order
        run: bun run test:unit:random-order

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-jammy
      options: --user root --ipc=host

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install unzip for Bun setup
        run: apt-get update && apt-get install -y unzip

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned for the same reason as the unit job — see the comment there.
          bun-version: 1.4.3

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Setup database
        run: bun run db:migrate && bun run db:seed

      - name: Run E2E checks
        run: bun run test:e2e

      # Upload on green runs too: with retries gone a flake fails the job,
      # and the report (traces, screenshots, timings) is what tells a timing
      # flake from a real regression.
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
