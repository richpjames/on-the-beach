name: Pi fix

# The softer half of the agent review: the PR-Agent review workflow only
# comments, and a person replies /fix on the pull request to have the findings
# applied to the branch. issue_comment workflows always run the copy of this
# file from the default branch, so this takes effect only once the change
# reaches main.
on:
  issue_comment:
    types: [created]

# Only comments that are exactly /fix (optionally with arguments) join the
# cancelling group; every other comment lands in the -false group so a stray
# reply can never cancel a fix that is mid-flight.
concurrency:
  group: pi-fix-${{ github.event.issue.number }}-${{ github.event.comment.body == '/fix' || startsWith(github.event.comment.body, '/fix ') }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A /fix comment on a pull request, from someone with write access. Fork
    # pull requests are rejected inside the job: comments from forks run here
    # in the base repo, with this repo's secrets.
    if: >
      github.event.issue.pull_request &&
      (github.event.comment.body == '/fix' || startsWith(github.event.comment.body, '/fix ')) &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    env:
      PR: ${{ github.event.issue.number }}
      ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Acknowledge the command
        run: gh api "repos/$GH_REPO/issues/comments/$COMMENT_ID/reactions" -f content=eyes || true
        env:
          COMMENT_ID: ${{ github.event.comment.id }}

      # Until the ZAI_API_KEY repository secret exists, stay green and say why.
      - name: Check the pull request can be fixed
        id: gate
        run: |
          if [ -z "$ZAI_API_KEY" ]; then
            echo "::notice::ZAI_API_KEY repository secret is not set, so /fix cannot run."
            exit 0
          fi
          gh pr view "$PR" --json state,isCrossRepository,headRefName > "$RUNNER_TEMP/pr.json"
          if [ "$(jq -r .state "$RUNNER_TEMP/pr.json")" != "OPEN" ]; then
            gh pr comment "$PR" --body "Pi fix: this pull request is not open, so there is nothing to fix."
            exit 0
          fi
          if [ "$(jq -r .isCrossRepository "$RUNNER_TEMP/pr.json")" = "true" ]; then
            gh pr comment "$PR" --body "Pi fix: findings on a fork pull request have to be applied by hand."
            exit 0
          fi
          # The review is matched on its author as well as its heading: the
          # heading alone could be forged in a comment by any commenter. gh
          # has been seen to report the workflow token's login both with and
          # without the [bot] suffix, so both forms are accepted. PR-Agent
          # keeps one persistent comment per heading per pull request.
          # --paginate, because the persistent comment is created once and
          # edited after: on a pull request with over 100 comments it can sit
          # far back in the conversation. The pages arrive as consecutive
          # JSON arrays, merged by jq's slurp.
          gh api --paginate "repos/$GH_REPO/issues/$PR/comments?per_page=100" > "$RUNNER_TEMP/comments.json"
          jq -rs 'add | [.[] | select((.user.login == "github-actions" or .user.login == "github-actions[bot]") and (.body | contains("PR Reviewer Guide")))] | last | .body // empty' "$RUNNER_TEMP/comments.json" > "$RUNNER_TEMP/pi-review.md"
          jq -rs 'add | [.[] | select((.user.login == "github-actions" or .user.login == "github-actions[bot]") and (.body | contains("PR Code Suggestions")))] | last | .body // empty' "$RUNNER_TEMP/comments.json" > "$RUNNER_TEMP/pi-suggestions.md"
          if [ ! -s "$RUNNER_TEMP/pi-review.md" ] && [ ! -s "$RUNNER_TEMP/pi-suggestions.md" ]; then
            gh pr comment "$PR" --body "Pi fix: there is no agent review on this pull request yet, so there is nothing to fix."
            exit 0
          fi
          echo "head_ref=$(jq -r .headRefName "$RUNNER_TEMP/pr.json")" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      # Without a PI_FIX_TOKEN secret the push falls back to github.token,
      # which does not re-trigger the checks — so this job runs the same lint
      # and unit test steps as CI before pushing. With a fine-grained PAT
      # (Contents: read and write on this repo) in PI_FIX_TOKEN everything
      # re-triggers normally and the fix commit gets its own CI run and review.
      - name: Checkout the head branch
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.gate.outputs.head_ref }}
          token: ${{ secrets.PI_FIX_TOKEN || github.token }}

      - name: Setup Node
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22

      # Pinned to the version validated locally; bump deliberately. 1.5.0
      # crashes on startup under the Node 22 runner — check before bumping.
      - name: Install pi
        if: steps.gate.outputs.run == 'true'
        run: npm install -g @earendil-works/pi-coding-agent@1.4.0

      - name: Setup Bun
        if: steps.gate.outputs.run == 'true'
        uses: oven-sh/setup-bun@v2

      - name: Write the fix instructions
        if: steps.gate.outputs.run == 'true'
        run: |
          cat <<'EOF' > "$RUNNER_TEMP/fix-instructions.md"
          You are the fix pass for this pull request. The repository is checked out at the pull request's head branch; the root AGENTS.md carries the project conventions (Bun not node, the retro design language, the hexagonal layer boundaries) — read it first and hold every change to it.

          Below is the review this pull request received. Apply its findings to the code. Your tools read and edit files but cannot run commands, so fix the code itself: no TODOs, no describing a change instead of making it. Touch only what the findings require — no reformatting, no drive-by refactors. Where a finding is wrong, or fixing it needs a decision the author should make, skip it and say so.

          Reply with a short markdown summary, one line per finding: fixed (and how), or skipped (and why). Do not wrap your reply in a code fence and do not begin it with a title or heading — the comment already carries one.
          EOF

      - name: Ask pi to fix the findings
        if: steps.gate.outputs.run == 'true'
        run: |
          {
            cat "$RUNNER_TEMP/fix-instructions.md"
            if [ -s "$RUNNER_TEMP/pi-review.md" ]; then
              echo
              echo "## The review"
              echo
              cat "$RUNNER_TEMP/pi-review.md"
            fi
            if [ -s "$RUNNER_TEMP/pi-suggestions.md" ]; then
              echo
              echo "## The code suggestions"
              echo
              cat "$RUNNER_TEMP/pi-suggestions.md"
            fi
          } > "$RUNNER_TEMP/fix-prompt.md"
          # Extensions and skills execute arbitrary code at load, whatever
          # --tools allows; applying review findings never needs them.
          pi -p --no-session \
            --provider zai --model glm-5.3 \
            --tools read,edit,write,grep,find,ls \
            --no-extensions --no-skills --no-prompt-templates --no-themes \
            "@$RUNNER_TEMP/fix-prompt.md" > "$RUNNER_TEMP/fix-summary.md"
          test -s "$RUNNER_TEMP/fix-summary.md"

      - name: Stop when pi changed nothing
        id: changes
        if: steps.gate.outputs.run == 'true'
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            {
              echo '#### Pi fix: nothing to apply'
              echo
              cat "$RUNNER_TEMP/fix-summary.md"
            } > "$RUNNER_TEMP/comment.md"
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
            exit 0
          fi
          echo "applied=true" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.changes.outputs.applied == 'true'
        run: bun install --frozen-lockfile --ignore-scripts

      # The same steps as the CI unit job (test.yml); the tests must pass
      # before anything is pushed.
      - name: Lint
        if: steps.changes.outputs.applied == 'true'
        run: bun run lint

      - name: Run unit tests
        if: steps.changes.outputs.applied == 'true'
        run: bun run test:unit

      - name: Push the fix to the branch
        id: push
        if: steps.changes.outputs.applied == 'true'
        env:
          HEAD_REF: ${{ steps.gate.outputs.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply the agent review findings" \
                    -m "Requested with the /fix command; lint and the unit tests ran in the pi-fix job before this push."
          git push origin HEAD:"$HEAD_REF"

      - name: Report the fix
        if: steps.changes.outputs.applied == 'true'
        run: |
          {
            echo '#### Pi fix applied (glm-5.3)'
            echo
            cat "$RUNNER_TEMP/fix-summary.md"
            echo
            echo "Pushed as commit $(git rev-parse --short HEAD)."
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"

      # Only claim nothing was pushed when the push step really did not run
      # or failed; if it succeeded and a later step failed, say that instead.
      - name: Report a failed fix
        if: failure()
        run: |
          if [ "${{ steps.push.outcome }}" = "success" ]; then
            gh pr comment "$PR" --body "Pi fix: the fix was pushed, but reporting it back failed — see the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) and check the branch for the commit."
          else
            gh pr comment "$PR" --body "Pi fix: applying the findings failed — see the [run log](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}). Nothing was pushed."
          fi

      # failure() does not fire on cancellation, so a run cut short would
      # otherwise vanish without a word. cancelled() also covers timeouts
      # and manual cancels, so the message hedges on the cause.
      - name: Report a superseded fix
        if: cancelled()
        run: |
          gh pr comment "$PR" --body "Pi fix: this run was cancelled before it finished — most likely superseded by a newer /fix. Nothing was applied from it."
