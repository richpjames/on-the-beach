name: iOS TestFlight

# Uploads a signed build to TestFlight (internal testing) on every merge to main
# that changes the app. The shell loads the live site, so web-only merges change
# nothing in the binary — the path filter mirrors ios-build.yml's definition of
# "changes the app" (plus this workflow and the scripts it runs), and macOS
# runners bill at 10x Linux minutes, so a build per web merge is money for nothing.
#
# The whole ios/ project is generated, so this job reproduces it exactly like
# ios-build.yml does — then hands off to scripts/archive-ios.sh (Release archive
# + export + altool upload; see docs/ios-native-app.md ▸ TestFlight). Signing is
# headless: -allowProvisioningUpdates authenticates with an App Store Connect
# API key instead of the Xcode GUI session a runner doesn't have.
#
# Build number = git commit count (same series as local `bun run ios:archive`),
# so every merge uploads a fresh version+build pair. Re-running a *successful*
# run of the same commit is rejected by TestFlight as a duplicate — retry via
# workflow_dispatch with a higher build_number instead.
#
# One-time setup (GitHub ▸ Settings ▸ Secrets and variables ▸ Actions):
#   OTB_INGEST_API_KEY  the real ingest key (CI builds embed a dummy only when
#                       this is unset, and shares won't post from that build)
#   OTB_API_KEY         ASC API key ID (Users and Access ▸ Integrations; App
#   OTB_API_ISSUER      Manager role covers upload + cloud-managed signing)
#   OTB_API_KEY_P8_B64  base64 of the key's AuthKey_<ID>.p8:
#                       base64 -i AuthKey_XXXX.p8 | gh secret set OTB_API_KEY_P8_B64

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "capacitor.config.ts"
      - "scripts/add-share-extension.rb"
      - "scripts/add-widget-extension.rb"
      - "scripts/add-listen-shortcut.rb"
      - "scripts/archive-ios.sh"
      - "scripts/lib/native-build-common.sh"
      - ".github/workflows/ios-testflight.yml"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number override — only needed to re-upload from the same commit"
        required: false
        type: string

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check required secrets
        # Before any setup: no point paying for a minute of Xcode/Bun/Ruby
        # tooling (macOS runners bill at 10x) just to learn a secret is missing
        # — the alternative failure is an obscure signing error halfway through
        # a 20-minute archive.
        env:
          OTB_API_KEY: ${{ secrets.OTB_API_KEY }}
          OTB_API_ISSUER: ${{ secrets.OTB_API_ISSUER }}
          OTB_API_KEY_P8_B64: ${{ secrets.OTB_API_KEY_P8_B64 }}
          OTB_INGEST_API_KEY: ${{ secrets.OTB_INGEST_API_KEY }}
        run: |
          missing=0
          for v in OTB_API_KEY OTB_API_ISSUER OTB_API_KEY_P8_B64 OTB_INGEST_API_KEY; do
            if [[ -z "${!v}" ]]; then
              echo "::error title=Missing secret::$v is not set (Settings ▸ Secrets and variables ▸ Actions)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout (full history)
        # The build number is the git commit count, so the checkout needs every
        # commit — actions/checkout's default depth of 1 would count 1.
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install CocoaPods + xcodeproj
        run: gem install cocoapods xcodeproj --no-document

      - name: Cache derived data
        # native-build-common.sh keeps derived data at a fixed path precisely so
        # a regenerated ios/ still hits Xcode's compile cache; carrying it
        # between runs cuts minutes off every merge at 10x Linux pricing.
        uses: actions/cache@v4
        with:
          path: build/ios
          key: ios-testflight-${{ hashFiles('bun.lock', 'package.json', 'native/**') }}
          restore-keys: ios-testflight-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Write build credentials
        # The real ingest key (a TestFlight build must actually be able to post
        # shares) and the App Store Connect API key, decoded to the ./private_keys
        # location both altool and archive-ios.sh look in.
        env:
          OTB_API_KEY: ${{ secrets.OTB_API_KEY }}
          OTB_API_ISSUER: ${{ secrets.OTB_API_ISSUER }}
          OTB_API_KEY_P8_B64: ${{ secrets.OTB_API_KEY_P8_B64 }}
          OTB_INGEST_API_KEY: ${{ secrets.OTB_INGEST_API_KEY }}
        run: |
          printf 'OTB_INGEST_API_KEY = %s\n' "$OTB_INGEST_API_KEY" > native/ShareExtension/Secrets.xcconfig
          mkdir -p private_keys
          printf '%s' "$OTB_API_KEY_P8_B64" | base64 --decode > "private_keys/AuthKey_${OTB_API_KEY}.p8"

      - name: Archive + upload to TestFlight
        # archive-ios.sh regenerates ios/, archives, exports the signed .ipa
        # (cloud-managed signing via the API key), and uploads with altool.
        # native_preflight keeps the Secrets.xcconfig written above.
        env:
          OTB_API_KEY: ${{ secrets.OTB_API_KEY }}
          OTB_API_ISSUER: ${{ secrets.OTB_API_ISSUER }}
          OTB_BUILD_NUMBER: ${{ inputs.build_number }}
        run: bun run ios:archive -- --upload

      - name: Summarise
        if: always()
        run: |
          echo "## TestFlight upload" >> "$GITHUB_STEP_SUMMARY"
          echo "Processing takes ~10–15 min; the build then appears under" >> "$GITHUB_STEP_SUMMARY"
          echo "App Store Connect ▸ TestFlight for internal testers." >> "$GITHUB_STEP_SUMMARY"
