name: iOS TestFlight

# Uploads a signed build to TestFlight (internal testing) on every merge to main
# that changes the app. The shell loads the live site, so web-only merges change
# nothing in the binary — the path filter mirrors ios-build.yml's definition of
# "changes the app" (plus this workflow and the scripts it runs), and macOS
# runners bill at 10x Linux minutes, so a build per web merge is money for nothing.
#
# The whole ios/ project is generated, so this job reproduces it exactly like
# ios-build.yml does — then hands off to scripts/archive-ios.sh (Release archive
# + export + altool upload; see docs/ios-native-app.md ▸ TestFlight). Signing is
# headless: -allowProvisioningUpdates authenticates with an App Store Connect
# API key instead of the Xcode GUI session a runner doesn't have.
#
# Build number = git commit count (same series as local `bun run ios:archive`),
# so every merge uploads a fresh version+build pair. Re-running a *successful*
# run of the same commit is rejected by TestFlight as a duplicate — retry via
# workflow_dispatch with a higher build_number instead.
#
# One-time setup (GitHub ▸ Settings ▸ Secrets and variables ▸ Actions):
#   OTB_INGEST_API_KEY          the real ingest key (CI builds embed a dummy
#                               only when unset, and shares won't post)
#   OTB_API_KEY                 an App Store Connect API key, App Manager role
#   OTB_API_ISSUER              (Admin NOT needed): it signs the archive step
#                               and drives the altool upload
#   OTB_API_KEY_P8_B64          base64 of the key's AuthKey_XXXX.p8
#   OTB_DISTRIBUTION_P12_B64    base64 of the Apple Distribution .p12 exported
#   OTB_DISTRIBUTION_P12_PASSWORD   from the build Mac's keychain, plus its passphrase
#   OTB_DIST_PROFILES_ZIP_B64   zip of the three App Store Connect
#                               .mobileprovision files (app, Share Extension,
#                               Widget) pinned to that certificate
# Distribution signing is MANUAL (cert + profiles imported per-run), so the
# API key never needs the Admin role that cloud signing would demand. Full
# walkthrough: docs/ios-native-app.md ▸ TestFlight ▸ Automated uploads.

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "capacitor.config.ts"
      - "scripts/add-share-extension.rb"
      - "scripts/add-widget-extension.rb"
      - "scripts/add-listen-shortcut.rb"
      - "scripts/archive-ios.sh"
      - "scripts/lib/native-build-common.sh"
      - ".github/workflows/ios-testflight.yml"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:
    inputs:
      build_number:
        description: "Build number override — only needed to re-upload from the same commit"
        required: false
        type: string

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check required secrets
        # Before any setup: no point paying for a minute of Xcode/Bun/Ruby
        # tooling (macOS runners bill at 10x) just to learn a secret is missing
        # — the alternative failure is an obscure signing error halfway through
        # a 20-minute archive.
        env:
          OTB_API_KEY: ${{ secrets.OTB_API_KEY }}
          OTB_API_ISSUER: ${{ secrets.OTB_API_ISSUER }}
          OTB_API_KEY_P8_B64: ${{ secrets.OTB_API_KEY_P8_B64 }}
          OTB_INGEST_API_KEY: ${{ secrets.OTB_INGEST_API_KEY }}
          OTB_DISTRIBUTION_P12_B64: ${{ secrets.OTB_DISTRIBUTION_P12_B64 }}
          OTB_DISTRIBUTION_P12_PASSWORD: ${{ secrets.OTB_DISTRIBUTION_P12_PASSWORD }}
          OTB_DIST_PROFILES_ZIP_B64: ${{ secrets.OTB_DIST_PROFILES_ZIP_B64 }}
        run: |
          missing=0
          for v in OTB_API_KEY OTB_API_ISSUER OTB_API_KEY_P8_B64 OTB_INGEST_API_KEY \
                   OTB_DISTRIBUTION_P12_B64 OTB_DISTRIBUTION_P12_PASSWORD OTB_DIST_PROFILES_ZIP_B64; do
            if [[ -z "${!v}" ]]; then
              echo "::error title=Missing secret::$v is not set (Settings ▸ Secrets and variables ▸ Actions)"
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout (full history)
        # The build number is the git commit count, so the checkout needs every
        # commit — actions/checkout's default depth of 1 would count 1.
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install CocoaPods + xcodeproj
        run: gem install cocoapods xcodeproj --no-document

      - name: Cache derived data
        # native-build-common.sh keeps derived data at a fixed path precisely so
        # a regenerated ios/ still hits Xcode's compile cache; carrying it
        # between runs cuts minutes off every merge at 10x Linux pricing.
        uses: actions/cache@v4
        with:
          path: build/ios
          key: ios-testflight-${{ hashFiles('bun.lock', 'package.json', 'native/**') }}
          restore-keys: ios-testflight-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Write build credentials
        # The real ingest key (a TestFlight build must actually be able to post
        # shares) and the App Store Connect API key, decoded to the ./private_keys
        # location both altool and archive-ios.sh look in. The p8 secret may hold
        # either the base64 of the .p8 or the pasted PEM itself — both work —
        # and is validated here so a bad paste dies in seconds with a fix, not
        # as an opaque exit 78 from xcodebuild minutes into the archive.
        env:
          OTB_API_KEY: ${{ secrets.OTB_API_KEY }}
          OTB_API_ISSUER: ${{ secrets.OTB_API_ISSUER }}
          OTB_API_KEY_P8_B64: ${{ secrets.OTB_API_KEY_P8_B64 }}
          OTB_INGEST_API_KEY: ${{ secrets.OTB_INGEST_API_KEY }}
        run: |
          printf 'OTB_INGEST_API_KEY = %s\n' "$OTB_INGEST_API_KEY" > native/ShareExtension/Secrets.xcconfig
          mkdir -p private_keys
          KEY_FILE="private_keys/AuthKey_${OTB_API_KEY}.p8"
          if printf '%s' "$OTB_API_KEY_P8_B64" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$OTB_API_KEY_P8_B64" > "$KEY_FILE"
          else
            printf '%s' "$OTB_API_KEY_P8_B64" | tr -d ' \r\n\t' | base64 --decode > "$KEY_FILE"
          fi
          if ! openssl pkey -in "$KEY_FILE" -noout 2>/dev/null; then
            echo "::error title=OTB_API_KEY_P8_B64 is not a usable key::OpenSSL cannot parse the decoded $(wc -c < "$KEY_FILE" | tr -d ' ') bytes as a private key — and OTB_API_KEY must be the Key ID of the SAME key the .p8 came from. Re-set both:"
            echo "    gh secret set OTB_API_KEY --body '<Key ID from the ASC key list>'"
            echo "    base64 -i AuthKey_<KeyID>.p8 | gh secret set OTB_API_KEY_P8_B64"
            echo "  (pasting the whole -----BEGIN PRIVATE KEY----- file into the secret value works too)"
            exit 1
          fi

      - name: Import distribution cert + profiles (manual signing)
        # Distribution signing without an Admin API key: a classic Apple
        # Distribution certificate (exported from the build Mac's keychain)
        # and the three App Store profiles go into a throwaway keychain and
        # the runner's profile dir. Each profile's NAME is resolved by bundle
        # id and exported for archive-ios.sh's ExportOptions — the names are
        # whatever they were called in the portal, so nothing here depends on
        # a naming convention.
        env:
          OTB_DISTRIBUTION_P12_B64: ${{ secrets.OTB_DISTRIBUTION_P12_B64 }}
          OTB_DISTRIBUTION_P12_PASSWORD: ${{ secrets.OTB_DISTRIBUTION_P12_PASSWORD }}
          OTB_DIST_PROFILES_ZIP_B64: ${{ secrets.OTB_DIST_PROFILES_ZIP_B64 }}
        run: |
          CERT_DIR="$(mktemp -d)"
          printf '%s' "$OTB_DISTRIBUTION_P12_B64" | base64 --decode > "$CERT_DIR/dist.p12"
          printf '%s' "$OTB_DIST_PROFILES_ZIP_B64" | base64 --decode > "$CERT_DIR/profiles.zip"
          unzip -qo "$CERT_DIR/profiles.zip" -d "$CERT_DIR/profiles"

          KEYCHAIN="ci-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -t 21600 -u "$KEYCHAIN"
          security import "$CERT_DIR/dist.p12" -k "$KEYCHAIN" \
            -P "$OTB_DISTRIBUTION_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" \
            $(security list-keychains -d user | tr -d '"')

          PROFILE_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILE_DIR"
          # Plain glob, not globstar: the zip is flat (zip -j), and macOS
          # runners ship bash 3.2 where `shopt -s globstar` is an error.
          for f in "$CERT_DIR"/profiles/*.mobileprovision; do
            security cms -D -i "$f" > "$CERT_DIR/profile.plist"
            UUID="$(plutil -extract UUID raw "$CERT_DIR/profile.plist")"
            NAME="$(plutil -extract Name raw "$CERT_DIR/profile.plist")"
            cp "$f" "$PROFILE_DIR/$UUID.mobileprovision"
            # Match on the exact entitlement field, not a whole-plist grep:
            # the plist embeds DER certificate data blobs, which make
            # `plutil -convert json` fail outright.
            APPID="$(plutil -extract 'Entitlements.application-identifier' raw "$CERT_DIR/profile.plist")"
            VAR=""
            case "$APPID" in
              *es.ricojam.onthebeach.ShareExtension*) VAR=OTB_PROFILE_SHARE ;;
              *es.ricojam.onthebeach.OTBWidget*)      VAR=OTB_PROFILE_WIDGET ;;
              *es.ricojam.onthebeach*)                VAR=OTB_PROFILE_APP ;;
            esac
            if [[ -z "$VAR" ]]; then
              echo "::error title=Unexpected provisioning profile::$(basename "$f") matches none of the app's three bundle IDs (got $APPID)"
              exit 1
            fi
            echo "$VAR=$NAME" >> "$GITHUB_ENV"
            echo "matched $VAR: $NAME ($APPID, $UUID)"
          done
          for v in OTB_PROFILE_APP OTB_PROFILE_SHARE OTB_PROFILE_WIDGET; do
            if ! grep -q "^$v=" "$GITHUB_ENV"; then
              echo "::error title=Missing profile::OTB_DIST_PROFILES_ZIP_B64 has no App Store profile for $v's bundle ID"
              exit 1
            fi
          done
          echo "OTB_EXPORT_MANUAL=1" >> "$GITHUB_ENV"
          rm -rf "$CERT_DIR"

      - name: Archive + upload to TestFlight
        # archive-ios.sh regenerates ios/, archives (cloud signing via the API
        # key), exports the .ipa with the imported certificate and profiles
        # (manual, no ASC access), and uploads with altool. native_preflight
        # keeps the Secrets.xcconfig written above. OTB_EXPORT_MANUAL=1 comes
        # from the import step's GITHUB_ENV write above.
        env:
          OTB_API_KEY: ${{ secrets.OTB_API_KEY }}
          OTB_API_ISSUER: ${{ secrets.OTB_API_ISSUER }}
          OTB_BUILD_NUMBER: ${{ inputs.build_number }}
        run: bun run ios:archive -- --upload

      - name: Remove signing keychain and profiles
        if: always()
        run: |
          security delete-keychain ci-signing.keychain-db >/dev/null 2>&1 || true
          rm -rf "$HOME/Library/MobileDevice/Provisioning Profiles"

      - name: Summarise
        if: always()
        run: |
          echo "## TestFlight upload" >> "$GITHUB_STEP_SUMMARY"
          echo "Processing takes ~10–15 min; the build then appears under" >> "$GITHUB_STEP_SUMMARY"
          echo "App Store Connect ▸ TestFlight for internal testers." >> "$GITHUB_STEP_SUMMARY"
