name: Deploy

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
  workflow_dispatch:

concurrency:
  # "Test" completes twice for a merge — once for the pull_request run and once
  # for the push to main — so this workflow fires twice. Only the push one gets
  # past the job's `if`; the other skips. Keyed on `github.ref` alone both land
  # in the same group, and the skipped run's arrival cancels the real deploy
  # mid-flight — which is why two merges in a row left the version at 1.0.197
  # with no bump commit. Including the triggering run's event keeps them apart.
  group: deploy-${{ github.workflow }}-${{ github.event.workflow_run.event || github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    timeout-minutes: 5
    steps:
      - name: Validate deployment secrets
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          if [ -z "$COOLIFY_WEBHOOK" ] || [ -z "$COOLIFY_TOKEN" ]; then
            echo "Missing COOLIFY_WEBHOOK or COOLIFY_TOKEN GitHub Actions secret."
            exit 1
          fi

      - name: Checkout (full history and tags)
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the deployed version
        # Branch protection requires every commit to main to go through a PR,
        # so the version lives in a tag instead of the old bump commit — the
        # branch ruleset doesn't cover tags. The Docker build and
        # archive-ios.sh read the tag back out; package.json's version is only
        # the seed for the first tag and the fallback for untagged builds.
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          # Highest tag wins, not just tags reachable from HEAD: a cancelled
          # run may have pushed a tag for a commit that never deployed.
          BASE=$( { git tag -l 'v[0-9]*'; echo "$PKG"; } | sort -V | tail -1)
          EXISTING=$(git tag --points-at HEAD | grep '^v[0-9]' | sort -V | tail -1 || true)
          if [ -n "$EXISTING" ]; then
            echo "HEAD is already tagged $EXISTING — reusing it (re-run?)"
            exit 0
          fi
          NEXT="v$(echo "${BASE#v}" | awk -F. '{printf "%d.%d.%d", $1, $2, $3+1}')"
          git tag "$NEXT"
          git push origin "$NEXT"
          echo "Deploying $NEXT"

      - name: Trigger Coolify deployment
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail --show-error --silent \
            --request POST "$COOLIFY_WEBHOOK" \
            --header "Authorization: Bearer $COOLIFY_TOKEN"
